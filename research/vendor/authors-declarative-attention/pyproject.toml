[project]
name = "dattn"
version = "0.1.0"
description = "Declarative Attention on vLLM"
readme = "README.md"
requires-python = "==3.13.*"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "vllm==0.29.0",
    "numpy",
    "pandas",
    "matplotlib",
]

# `datasets` is needed by exactly one function, `dattn.eval.datasets.select_rows`, which
# reproduces dac's `filter -> shuffle(seed) -> select` row selection. It is an extra
# rather than a dependency because parity, judging and analysis consume recorded outputs.
#
#   uv pip install datasets      # or: uv sync --extra eval
[project.optional-dependencies]
eval = ["datasets"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest",
    "ruff",
]

# The general plugin runs in every worker, the EngineCore and the front end
# (N:plugins/__init__.py:18,77). It registers DattnBackend in the CUSTOM slot.
[project.entry-points."vllm.general_plugins"]
dattn = "dattn.engine.plugin:install_plugin"

# There is deliberately NO [project.entry-points."vllm.logits_processors"] table.
# DESIGN.md section 4: the logits processor is registered by fully qualified class
# name, `--logits-processors dattn.engine.processor:DattnLogitsProcessor`, because
#   1. only the CLI route sets `logitsprocs_need_output_token_ids`, and
#   2. the MRV2 demotion check counts INSTALLED entry points, so shipping one would make
#      every arm's model runner depend on what happens to be in the venv.
# `tests/unit/test_entry_points.py` fails if that table is ever added.

[project.scripts]
dattn = "dattn.cli:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config -m 'not gpu'"
markers = [
    "gpu: needs an explicitly assigned GPU. Run with `-m gpu`.",
    "contract: imports vllm and pins a 0.29.0 internal. CPU only.",
    "slow: over one second.",
]
filterwarnings = ["error::DeprecationWarning:dattn.*"]
