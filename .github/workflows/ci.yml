name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q colab_server.py examples tests
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: bash -n scripts/install.sh scripts/authenticate.sh
      - name: Dry-run local plan (never allocates)
        run: python colab_server.py plan --gpu T4 --script examples/gpu_probe.py
