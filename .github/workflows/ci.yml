name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.8", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q colab_server.py colab_adapter examples tests
      - name: Run offline tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Check shell syntax
        run: bash -n scripts/install.sh scripts/authenticate.sh
      - name: Dry-run local plan (never allocates)
        run: python colab_server.py plan --gpu T4 --script examples/gpu_probe.py

  browser-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]" 2>/dev/null || true
      - name: Install pinned Playwright and Chromium
        run: |
          npm init -y
          npm install playwright-core@1.51.0
          npx --no-install playwright-core install --with-deps chromium
          node -e "const pw = require('playwright-core'); console.log('Chromium path:', pw.chromium.executablePath());"
      - name: Run real headless Chromium security suite
        env:
          COLAB_REQUIRE_BROWSER_TESTS: "1"
        run: |
          python -m unittest tests/test_browser_xss_and_cross_process_qa.py -v
      - name: Verify industrial theme in real Chromium (offline fixtures)
        env:
          COLAB_REQUIRE_BROWSER_TESTS: "1"
        run: python -m unittest tests/test_industrial_theme_browser.py -v
      - name: Attach non-secret theme screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-industrial-themes
          path: artifacts/monitor-*.png
          if-no-files-found: ignore
          retention-days: 7
